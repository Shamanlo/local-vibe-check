name: Deploy to Cloudflare Pages

on:
  push:
  schedule:
    # Daily rebuild so new YouTube uploads get their pages without a commit.
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Pushes deploy only from the default branch; scheduled and manual runs always deploy.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: local-vibe-check
      DOMAIN: localvibecheck.site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build site
        run: npm run build

      - name: Check Cloudflare secret
        id: secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Site built but not deployed. Add CLOUDFLARE_API_TOKEN under Settings > Secrets and variables > Actions, then re-run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find Cloudflare account
        if: steps.secret.outputs.ok == 'true'
        run: python3 tools/cloudflare_setup.py account

      - name: Create Pages project
        if: steps.secret.outputs.ok == 'true'
        run: python3 tools/cloudflare_setup.py project

      - name: Deploy
        if: steps.secret.outputs.ok == 'true'
        run: npx --yes wrangler@4.140.0 pages deploy public --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Connect localvibecheck.site
        if: steps.secret.outputs.ok == 'true'
        run: python3 tools/cloudflare_setup.py domains
